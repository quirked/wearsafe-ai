# Label maps: source label -> derived classes (docs/WearSafe_AI_Context.md §15–§17).
# Rules:
#   - original_label is always kept; derived classes are added alongside it (CLAUDE.md §3).
#   - null = no derived class (sample/window excluded from that task, NOT dropped from storage).
#   - "TODO" = open decision for the user; code must refuse to build a task dataset
#     while a needed mapping is TODO.
#   - There is no "attack" class anywhere (CLAUDE.md §2.3).
#   - GENERAL RULE (user decision 2026-10-12): ambiguous segments are EXCLUDED from
#     component-model training but INCLUDED in false-alert-per-hour evaluation.
#   - Training sets are built ONLY from the `training_v1` lists. A TODO class mapping on a
#     label listed under `training_v1.excluded` does not block a build.
#   - `eval_role` records why an excluded label is kept (false-alert evaluation or probe).
version: 1

subject_id_format: "{PREFIX}_S{nn:02d}"   # PPGDALIA_S01, WESAD_S02, BITS2_S03
subject_prefix:
  ppg_dalia: PPGDALIA
  wesad: WESAD
  bits2: BITS2

classes:
  context_class: [stationary, low_activity, locomotion, vigorous_activity]
  motion_event_class: [normal_adl, abrupt_event_proxy]
  arousal_class: [low_arousal, high_arousal]

ppg_dalia:
  source: "SX.pkl['activity'] (4 Hz); codes verified in reports/D00a_data_inventory.md §1.4"
  original_label:            # code -> name
    0: transient             # includes CSV 'NO_ACTIVITY' and 'CLEAN_BASELINE'
    1: sitting
    2: stairs
    3: table_soccer
    4: cycling
    5: driving
    6: lunch
    7: walking
    8: working
  context_class:             # context doc §16
    transient: null          # excluded from v1 context training; included in false-alert eval (decision 2026-10-12 #4)
    sitting: stationary
    working: low_activity
    driving: low_activity
    walking: locomotion
    stairs: vigorous_activity
    cycling: vigorous_activity
    table_soccer: vigorous_activity
    lunch: TODO              # class still undecided (context doc §16/§41); excluded from v1 context training, included in false-alert eval (decision 2026-10-12 #3)
  hard_negative: [table_soccer, stairs, cycling]   # context doc §17
  motion_event_class:        # CONFIRMED by user after D00b (P3): every PPG-DaLiA window is normal_adl, transient included
    default: normal_adl
    transient: normal_adl
  arousal_class: null        # no arousal ground truth in PPG-DaLiA; null for ALL windows, never inferred from activity or HR (user decision B after D00b)
  training_v1:               # user decisions 2026-10-12 #3, #4
    context: [sitting, working, driving, walking, stairs, cycling, table_soccer]
    excluded: [transient, lunch]
  eval_role:
    transient: false_alert_eval
    lunch: false_alert_eval

wesad:
  source: "SX.pkl['label'] (700 Hz); codes from wesad_readme.pdf"
  original_label:
    0: transient
    1: baseline
    2: stress
    3: amusement
    4: meditation
    5: ignore_5              # inferred bRead (D00a §2.4); docs: "should be ignored"
    6: ignore_6              # inferred sRead
    7: ignore_7              # inferred fRead
  arousal_class:
    transient: null
    baseline: low_arousal
    stress: high_arousal
    amusement: TODO          # not used for v1 training; evaluation probe, see eval_role (decision 2026-10-12 #2)
    meditation: TODO         # not used for v1 training; evaluation probe, see eval_role (decision 2026-10-12 #2)
    ignore_5: null
    ignore_6: null
    ignore_7: null
  hard_negative: [amusement]
  context_class: null        # lab protocol, not daily-life context
  motion_event_class: null
  training_v1:               # user decision 2026-10-12 #1
    arousal: [baseline, stress]
    excluded: [transient, amusement, meditation, ignore_5, ignore_6, ignore_7]
  eval_role:                 # user decision 2026-10-12 #2
    amusement: {role: probe, expected: high_arousal, note: "non-danger high arousal probe"}
    meditation: {role: probe, expected: low_arousal, note: "expected-low probe"}

bits2:
  source: "Dataset/{adl,fall}/userN/userN_{adl,fall}K.csv; activity names UNKNOWN (no docs in download)"
  original_label: "file stem, e.g. adl7 / fall3 (kept verbatim)"
  event_type:
    adl: adl
    fall: fall
  motion_event_class:        # context doc §9/§15: falls are abrupt-event PROXIES, not attacks
    adl: normal_adl
    fall: abrupt_event_proxy
  context_class: TODO        # stays TODO until the activity table from the paper is available; no guessing (decision 2026-10-12 #5)
  arousal_class: null
  repetitions_per_activity:  # decision 2026-10-12 #7
    value: 5
    status: "stated in paper, not yet verified in files"
    source: "Nandi et al., Data in Brief 52 (2024) 109812, abstract (PMC10709028)"
    d00b_finding: "files contain ~1 trial each (reports/D00b_bits2_forensics.md §4); ~984 recordings, never claim 4,920"
  # ---- user decisions after D00b (PROJECT_LOG 2026-10-12 04:20) ----
  context_class_proposal:    # Q6: confirmed as a proposal for ANALYSIS and HARD NEGATIVES only; NOT used for context training
    status: "confirmed by user as proposal for analysis and hard negatives only; v1 context model trains on PPG-DaLiA only"
    source: "reports/D00b_bits2_forensics.md §8 (paper Table 1 activity names)"
    mapping:                 # null = no context class (motion hard negative / false-alert eval)
      adl1: locomotion         # walking slowly
      adl2: locomotion         # walking quickly
      adl3: vigorous_activity  # jogging (hard negative)
      adl4: vigorous_activity  # jumping (hard negative)
      adl5: vigorous_activity  # climbing (assumed stairs, not stated in paper)
      adl6: vigorous_activity
      adl7: vigorous_activity  # duration-flagged
      adl8: vigorous_activity  # duration-flagged
      adl9: null               # sitting on chair (motion hard negative)
      adl10: null
      adl11: null
      adl12: null              # swinging hands (motion hard negative)
      adl13: stationary        # lying on bed
      adl14: null              # getting up / turning while lying (motion hard negatives)
      adl15: null
      adl16: null
  training_v1:               # Q2, Q6
    motion: []
    context: []
    note: "BITS-2 is excluded from v1 motion-model and context-model training"
  motion_features_v1:        # Q1: time-independent only (sampling rate verdict 'inconsistent', D00b)
    allowed: [acc_mag_percentiles, acc_mag_peak, acc_mag_fraction_above_threshold]
    notes:
      acc_mag_peak: "may be underestimated in low-rate files"
      acc_mag_fraction_above_threshold: "FRACTION of samples (not count), e.g. above 2 g"
    forbidden: [jerk, frequency_features, sample_count_features, fixed_sample_count_windows]
    use: "descriptive whole-file fall-vs-ADL analysis only (Q2): compare percentiles and fractions, not just maxima"
  hr_analysis_v1:
    exclude_files: [adl7, adl8]                  # Q3: kept for motion (motion_ok), excluded from HR analysis
    event_centred: postponed                     # Q4: fall timing cannot be placed on the HR timeline
    replacement: "coarse whole-file HR comparison, fall vs ADL files, clearly labelled coarse"
    health_conditions: "subjects stay in; relative-to-baseline HR; report per subject (Q7)"
  exclusion_rule_q5:         # Q5 / P1: defined now, applied at the next BITS-2 milestone (metadata/bits2_exclusions_v2.csv)
    rule: "exclude a timestamp-break file only if every stream (acc, acg, gyro, mgm, hrt) has the same number (>=2) of segments"
    status: "defined, not yet applied"

units:                       # original -> canonical (context doc §20; D00a §4)
  ppg_dalia:
    wrist_acc: {original: g, canonical: m/s^2, factor: 9.80665}
  wesad:
    wrist_acc: {original: "1/64 g", canonical: m/s^2, factor: 0.15322890625}   # 9.80665 / 64
  bits2:
    acc: {original: "m/s^2 (inferred, gravity removed)", canonical: m/s^2, factor: 1.0}
    acg: {original: "m/s^2 (inferred, incl. gravity)", canonical: m/s^2, factor: 1.0}
    gyro: {original: "rad/s (inferred)", canonical: rad/s, factor: 1.0}
    mgm: {original: "uT (inferred)", canonical: uT, factor: 1.0}
    hrt: {original: bpm, canonical: bpm, factor: 1.0}

open_items:                  # decision 2026-10-12 #6
  - milestone: D02
    item: "per-sample acc_saturated flag for the ±2 g E4 watch ACC range (PPG-DaLiA, WESAD)"
    decision: "none yet"
  - milestone: D00c
    item: "audit FallAllD (data/raw/fallalld/) and UP-Fall (data/raw/upfall/); SMOTE pkl banned (CLAUDE.md §2.3)"
    decision: "none yet"
  - milestone: "motion branch (after D00c)"
    item: "PROPOSED design change, pending audits: BITS-2 supporting dataset; FallAllD main motion-training candidate; UP-Fall external validation; device harmonisation experiment (common rate + clip to ±2 g, identical for all datasets, always reported with the unharmonised version)"
    decision: "proposed, pending audits; not applied"
